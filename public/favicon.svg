<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- roadmap bar the duck swims on -->
  <rect x="7" y="53" width="50" height="6" rx="3" fill="#ffffff"/>
  <rect x="7" y="53" width="22" height="6" rx="3" fill="#22d3ee"/>
  <!-- tail -->
  <path d="M7 33 L19 39 L11 47 Z" fill="#fde047" stroke="#1e1b4b" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="31" cy="42" rx="22" ry="13" fill="#fde047" stroke="#1e1b4b" stroke-width="3.5"/>
  <!-- wing -->
  <path d="M17 41 C22 34 34 36 36 43 C32 49 21 49 17 41Z" fill="#facc15" stroke="#1e1b4b" stroke-width="3" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="43" cy="22" r="14" fill="#fde047" stroke="#1e1b4b" stroke-width="3.5"/>
  <!-- beak -->
  <path d="M54 20 C62 20 63 26 56 28 C54 28.5 52 27 52 25Z" fill="#fb923c" stroke="#1e1b4b" stroke-width="3" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="45" cy="18.5" r="3.4" fill="#1e1b4b"/>
  <circle cx="46.2" cy="17.3" r="1.2" fill="#ffffff"/>
</svg>
