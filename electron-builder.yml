# Desktop packaging. The web app is built to dist/ first (npm run build), then bundled here.
# Builds are unsigned (no paid certificates): see README "Desktop app" for first-run warnings.
appId: com.jacobbenjamin.roadmapbuilder
productName: Roadmap Builder Studio
copyright: Copyright © Jacob Benjamin
directories:
  output: release
files:
  - dist/**
  - electron/**
  - '!electron/**/*.test.js'
  - package.json
asar: true
publish:
  provider: github
  owner: jbenjamin98
  repo: roadmap-builder
  releaseType: draft

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: RoadmapBuilder-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: RoadmapBuilder-${version}-${arch}.${ext}
  notarize: false

# AppImage only: it runs on any distro and supports auto-update. A .deb would need a maintainer
# email in package.json, which would be published with the repo.
linux:
  category: Office
  target:
    - AppImage
  artifactName: RoadmapBuilder-${version}-${arch}.${ext}
